# The real server. Start it with:  java -jar backend.jar --spring.profiles.active=prod
# (On the Oracle server this is done for you by deploy/oracle/docker-compose.yml.)
# The database login comes from environment variables, never from this file:
#   NEXUS_DB_URL       e.g. jdbc:postgresql://localhost:5432/nexus
#   NEXUS_DB_USER
#   NEXUS_DB_PASSWORD

spring:
  datasource:
    url: ${NEXUS_DB_URL}
    username: ${NEXUS_DB_USER}
    password: ${NEXUS_DB_PASSWORD}

server:
  # Players reach the server through Caddy (the HTTPS front door). Caddy tells the server each
  # player's real internet address in an "X-Forwarded-For" header – use it, so limits like
  # "10 crash reports per hour per address" count real players, not Caddy.
  forward-headers-strategy: native

nexus:
  dev-auth: false           # NEVER true here: it would let anyone sign in as anyone
