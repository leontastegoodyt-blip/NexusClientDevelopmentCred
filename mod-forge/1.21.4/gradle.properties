# Forge 1.21.4 build of the Nexus mod (see build.gradle.kts next to this file).
minecraft_version=1.21.4
# Which Minecraft versions this build runs on (written into mods.toml)
minecraft_range=[1.21.4,1.21.5)
# Forge's recommended build for 1.21.4 (only compiled against – the player's Forge is used in game)
forge_version=1.21.4-54.1.14
eventbus_version=6.2.27
forgespi_version=7.1.5
# The Fabric build whose code this reuses (folder in mod-fabric-modern)
fabric_build=1.21.4
# Forge 1.21.4 doesn't include MixinExtras, so it's packed inside the jar
pack_mixinextras=true
