# Forge 1.20.6 build of the Nexus mod (see build.gradle.kts next to this file).
minecraft_version=1.20.6
# Which Minecraft versions this build runs on (written into mods.toml)
minecraft_range=[1.20.6,1.20.7)
# Forge's recommended build for 1.20.6 (only compiled against – the player's Forge is used in game)
forge_version=1.20.6-50.2.0
eventbus_version=6.2.27
forgespi_version=7.1.4
# The Fabric build whose code this reuses (folder in mod-fabric-modern)
fabric_build=1.20.6
# Forge 1.20.6's Mixin (0.8.5) knows Java levels up to 18 (the code is Java 21)
mixin_java=18
# Forge 1.20.6 doesn't include MixinExtras, so it's packed inside the jar
pack_mixinextras=true
