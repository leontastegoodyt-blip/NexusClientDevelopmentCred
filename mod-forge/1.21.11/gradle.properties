# Forge 1.21.11 build of the Nexus mod (see build.gradle.kts next to this file).
minecraft_version=1.21.11
# Which Minecraft versions this build runs on (written into mods.toml)
minecraft_range=[1.21.11,1.21.12)
# Forge's recommended build for 1.21.11 (only compiled against – the player's Forge is used in game)
forge_version=1.21.11-61.2.0
eventbus_version=7.0.5
forgespi_version=8.0.0
# The Fabric build whose code this reuses (folder in mod-fabric-modern)
fabric_build=1.21.11
# Forge 1.21.11 includes MixinExtras itself
pack_mixinextras=false
