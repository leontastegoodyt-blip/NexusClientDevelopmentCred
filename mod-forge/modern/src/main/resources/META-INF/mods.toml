# The Nexus mod for Forge (Minecraft 1.20.4 – 1.21.11). Forge reads this file to know what the mod is.
# The build fills in the version, loader and range parts for each Minecraft version (see mod-forge/<version>/gradle.properties).
modLoader="javafml"
loaderVersion="[${loader_major},)"
license="All-Rights-Reserved"

[[mods]]
modId="nexusclient"
version="${version}"
displayName="Nexus Client"
authors="Nexus Client"
description='''
The Nexus Client in-game mod: mod menu (Right Shift), HUD editor, HUD, PvP, visual, chat and utility mods.
'''

[[dependencies.nexusclient]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="CLIENT"
