# Forge 1.20.4 build of the Nexus mod (see build.gradle.kts next to this file).
minecraft_version=1.20.4
# Which Minecraft versions this build runs on (written into mods.toml)
minecraft_range=[1.20.4,1.20.5)
# Forge's recommended build for 1.20.4 (only compiled against – the player's Forge is used in game)
forge_version=1.20.4-49.2.0
eventbus_version=6.2.27
forgespi_version=7.1.3
# The Fabric build whose code this reuses (folder in mod-fabric-modern)
fabric_build=1.20.4
# Forge 1.20.4 runs the game with SRG names: rename the jar with this MCPConfig
mcp_config=1.20.4-20231207.112700
# Forge 1.20.4 doesn't include MixinExtras, so it's packed inside the jar
pack_mixinextras=true
