# Settings shared by the whole Nexus build.
# The Fabric mod loader version used by every modern Fabric build of the Nexus mod (mod-fabric-modern).
fabric_loader_version=0.19.5

# Gradle builds 7 Minecraft versions of the mod (each needs a lot of memory) – give it 4 GB so it
# never runs out (it did with the default 512 MB and hung).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
